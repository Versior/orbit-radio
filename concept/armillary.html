<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>环听 · 浑天仪调频（概念稿）</title>
<style>
  :root {
    --bg: #080a0f; --ink: #eee6d4; --dim: #a29d90; --mute: #5f626b;
    --brass: #c8a26a; --brass-dim: rgba(200, 162, 106, .38); --cinnabar: #e2442b;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
    --sans: Inter, system-ui, "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--sans);
    background: radial-gradient(1100px 820px at 47% 46%, #111621 0%, #090b10 58%, #050608 100%); }
  canvas { position: fixed; inset: 0; }

  /* 左上：朱砂印章 */
  .seal { position: fixed; left: 44px; top: 38px; display: flex; align-items: center; gap: 14px; }
  .seal i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 3px; background: var(--cinnabar);
    color: #f7ebe2; font: 600 16px/1 KaiTi, STKaiti, var(--serif); writing-mode: vertical-rl; letter-spacing: 1px;
    box-shadow: inset 0 0 0 2px rgba(255, 240, 230, .22); transform: rotate(-2deg); font-style: normal; }
  .seal b { font: 500 13px/1.3 var(--mono); letter-spacing: .32em; color: var(--dim); }

  /* 左缘：竖排诗句 */
  .poem { position: fixed; left: 52px; top: 50%; transform: translateY(-50%); display: flex; gap: 14px;
    writing-mode: vertical-rl; font: 400 15px/1 var(--serif); letter-spacing: .55em; color: rgba(238, 230, 212, .62); }
  .poem span:last-child { color: rgba(238, 230, 212, .3); }
  .poem small { margin-top: 1.6em; font: 400 11px/1 var(--serif); letter-spacing: .3em; color: var(--mute); }

  /* 右上：只留文字入口 */
  .top { position: fixed; right: 44px; top: 44px; display: flex; gap: 30px; font-size: 13px; color: var(--dim); }
  .top kbd { margin-left: 8px; padding: 1px 6px; border: 1px solid rgba(238, 230, 212, .2); border-radius: 4px; font: 11px var(--mono); color: var(--mute); }
  .top b { font-weight: 500; color: var(--ink); }

  /* 顶部中间：此刻的晨昏线 */
  .now-line { position: fixed; left: 0; right: 0; top: 46px; text-align: center; font: 400 12px/1 var(--mono); letter-spacing: .2em; color: var(--mute); }
  .now-line em { font-style: normal; color: var(--brass); }

  /* 右侧：沿调谐经线由北向南的电台刻度 */
  .scale { position: fixed; left: 1118px; top: 0; width: 280px; font-size: 13px; }
  .scale h3 { position: absolute; top: 150px; margin: 0; font: 400 11px/1 var(--mono); letter-spacing: .22em; color: var(--mute); white-space: nowrap; }
  .scale .st { position: absolute; left: 0; display: grid; gap: 3px; white-space: nowrap; transform: translateY(-50%); }
  .scale .st b { font: 400 15px/1.2 var(--serif); color: rgba(238, 230, 212, .78); }
  .scale .st small { font: 400 10.5px/1 var(--mono); letter-spacing: .12em; color: var(--mute); }
  .scale .st.on b { color: var(--cinnabar); font-size: 17px; }
  .scale .st.on small { color: var(--brass); }

  /* 底部中间：收音机读数 */
  .read { position: fixed; left: 0; right: 0; bottom: 46px; display: grid; justify-items: center; gap: 10px; }
  .read .coord { font: 400 11.5px/1 var(--mono); letter-spacing: .24em; color: var(--brass); }
  .read h1 { margin: 0; font: 400 34px/1.1 var(--serif); letter-spacing: .06em; }
  .read p { margin: 0; font-size: 13px; color: var(--dim); letter-spacing: .04em; }
  .ctrl { display: flex; align-items: center; gap: 30px; margin-top: 8px; color: var(--dim); font-size: 13px; }
  .ctrl .play { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--cinnabar); color: var(--cinnabar); }
  .ctrl svg { width: 16px; height: 16px; fill: currentColor; }

  /* 左下：调频方式 */
  .mode { position: fixed; left: 44px; bottom: 50px; display: grid; gap: 12px; font-size: 13px; color: var(--mute); }
  .mode div { display: flex; align-items: center; gap: 10px; }
  .mode div::before { content: ""; width: 14px; height: 1px; background: currentColor; }
  .mode .on { color: var(--ink); }
  .mode .on::before { background: var(--cinnabar); width: 24px; }
  .mode small { margin-left: 34px; font-size: 11.5px; line-height: 1.6; color: var(--mute); max-width: 210px; }

  .tag { position: fixed; right: 44px; bottom: 50px; font: 400 11px/1.6 var(--mono); letter-spacing: .14em; color: var(--mute); text-align: right; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="seal"><i>环听</i><b>ORBIT</b></div>
<div class="poem"><span>坐地日行八万里</span><span>巡天遥看一千河</span></div>
<nav class="top"><span>找电台<kbd>/</kbd></span><span>收藏 <b>3</b></span><span>足迹</span></nav>
<div class="now-line">UTC 11:16 · 日落线正经过 <em>曼谷</em> · 向西每小时 15°</div>

<div class="scale" id="scale"><h3>沿东经 116° · 由北向南</h3></div>

<div class="read">
  <div class="coord">E 116.4° · N 39.9° · 北京 19:00 黄昏</div>
  <h1>北京音乐广播 97.4</h1>
  <p>流行 · 华语 · 128 kbps</p>
  <div class="ctrl">
    <span>↑ 北</span>
    <svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg>
    <span class="play"><svg viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></span>
    <svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg>
    <span>南 ↓</span>
  </div>
</div>

<div class="mode">
  <div>自由调频</div>
  <div class="on">追着日落听</div>
  <small>指针停在正在日落的经线上，随地球自转慢慢西移。坐着不动，一晚上听遍半个地球。</small>
  <div>追着日出听</div>
</div>
<div class="tag">拖动地球 = 转旋钮<br>↑ ↓ 沿经线换台</div>

<script type="module">
const RAD = Math.PI / 180;
const W = innerWidth, H = innerHeight;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const dpr = Math.min(2, devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
g.scale(dpr, dpr);

const CX = 680, CY = 384, R = 262;
const VIEW_LAT = 17, VIEW_LON = 108;    // 相机看向的点
const TUNE_LON = 116.4;                  // 调谐经线
const SUN = xyz(-15.6, 11);              // 11 月初、UTC 11:16 的太阳直射点
const UTC = 11.27;

function xyz(lat, lon) { const p = lat * RAD, l = lon * RAD; return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)]; }
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const D = xyz(VIEW_LAT, VIEW_LON);
const U = [-Math.sin(VIEW_LON * RAD), Math.cos(VIEW_LON * RAD), 0];
const V = [-Math.sin(VIEW_LAT * RAD) * Math.cos(VIEW_LON * RAD), -Math.sin(VIEW_LAT * RAD) * Math.sin(VIEW_LON * RAD), Math.cos(VIEW_LAT * RAD)];
const scr = (p, r = 1) => [CX + dot(p, U) * R * r, CY - dot(p, V) * R * r, dot(p, D)];
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const inflate = async (u) => new Response((await fetch(u)).body.pipeThrough(new DecompressionStream('deflate'))).arrayBuffer();

const [meta, raw, geo] = await Promise.all([
  fetch('/vendor/countries.json').then((r) => r.json()), inflate('/vendor/world-ids.bin'), fetch('/api/geo').then((r) => r.json()),
]);
const tex = new Uint8Array(raw);
const land = (lat, lon) => {
  const x = Math.min(meta.w - 1, Math.floor((lon + 180) / 360 * meta.w));
  const y = Math.min(meta.h - 1, Math.floor((90 - lat) / 180 * meta.h));
  return tex[y * meta.w + x] > 0;
};

// ---------- 星空 ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 260; i++) {
  const x = rnd() * W, y = rnd() * H;
  if (Math.hypot(x - CX, y - CY) < R * 1.25) continue;
  g.fillStyle = `rgba(238,230,212,${0.08 + rnd() * 0.22})`;
  g.fillRect(x, y, rnd() < 0.1 ? 1.6 : 1, rnd() < 0.1 ? 1.6 : 1);
}

// ---------- 浑天仪：赤道环 ----------
const RING = 1.17;
const ringPt = (lon, r = RING, z = 0) => { const l = lon * RAD; return [Math.cos(l) * r, Math.sin(l) * r, z]; };
const hidden = (p) => { const [x, y, d] = scr(p); return d < 0 && Math.hypot(x - CX, y - CY) < R; };
// 每 2° 一格的电台数，画成立在环上的频谱
const bins = new Array(180).fill(0);
for (const [, lon, n] of geo.clusters) bins[Math.floor((lon + 180) / 2) % 180] += n;
const maxBin = Math.max(...bins);

function drawRing(front) {
  g.lineCap = 'round';
  // 主环（两道细线，像铜环的边）
  for (const r of [RING, RING + 0.012]) {
    g.beginPath(); let pen = false;
    for (let a = 0; a <= 360; a += 1) {
      const p = ringPt(a, r); const [x, y, d] = scr(p);
      const ok = front ? d >= 0 : d < 0 && !hidden(p);
      if (ok) { pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; } else pen = false;
    }
    g.strokeStyle = front ? 'rgba(200,162,106,.75)' : 'rgba(200,162,106,.22)'; g.lineWidth = 1; g.stroke();
  }
  // 频谱柱
  for (let i = 0; i < 180; i++) {
    if (!bins[i]) continue;
    const lon = i * 2 - 180 + 1; const base = ringPt(lon, RING + 0.02);
    const [x, y, d] = scr(base);
    if (front ? d < 0 : d >= 0 || hidden(base)) continue;
    const h = (Math.log2(bins[i] + 1) / Math.log2(maxBin + 1)) * 0.05;
    const [x2, y2] = scr(ringPt(lon, RING + 0.02, h));
    const near = Math.abs(lon - TUNE_LON) < 3;
    g.strokeStyle = near ? 'rgba(226,68,43,.95)' : front ? `rgba(200,162,106,${0.35 + 0.4 * d})` : 'rgba(200,162,106,.16)';
    g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
  }
  // 小时刻度：每 15° 一个当地太阳时
  g.font = '400 11px "Cascadia Mono", Consolas, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let a = -180; a < 180; a += 3.75) {
    const major = Math.abs(a % 15) < 0.01;
    const p0 = ringPt(a, RING - 0.012), p1 = ringPt(a, RING - (major ? 0.045 : 0.024));
    const [x0, y0, d] = scr(p0); const [x1, y1] = scr(p1);
    if (front ? d < 0 : d >= 0 || hidden(p0)) continue;
    g.strokeStyle = front ? `rgba(200,162,106,${0.3 + 0.5 * d})` : 'rgba(200,162,106,.14)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    if (major && front && d > 0.08) {
      const hr = ((UTC + a / 15) % 24 + 24) % 24;
      const [lx, ly] = scr(ringPt(a, RING + 0.125));
      g.fillStyle = `rgba(200,162,106,${0.25 + 0.6 * d})`;
      g.fillText(String(Math.floor(hr)).padStart(2, '0'), lx, ly);
    }
  }
}

// 环的背面先画，地球会挡住它
drawRing(false);

// ---------- 地球 ----------
// 暗底 + 很淡的大气边
const disc = g.createRadialGradient(CX - R * 0.3, CY - R * 0.3, R * 0.1, CX, CY, R);
disc.addColorStop(0, '#121824'); disc.addColorStop(1, '#0b0f17');
g.fillStyle = disc; g.beginPath(); g.arc(CX, CY, R, 0, 7); g.fill();
const rim = g.createRadialGradient(CX, CY, R * 0.96, CX, CY, R * 1.07);
rim.addColorStop(0, 'rgba(120,150,190,0)'); rim.addColorStop(0.45, 'rgba(120,150,190,.10)'); rim.addColorStop(1, 'rgba(120,150,190,0)');
g.fillStyle = rim; g.beginPath(); g.arc(CX, CY, R * 1.07, 0, 7); g.fill();

// 点阵：白天像印在纸上的地图，黑夜里只剩一层灰
const STEP = 1.05;
for (let lat = -84; lat <= 84; lat += STEP) {
  const ls = STEP / Math.max(0.2, Math.cos(lat * RAD));
  for (let lon = -180; lon < 180; lon += ls) {
    const p = xyz(lat, lon); const [x, y, d] = scr(p);
    if (d <= 0.02) continue;
    const s = dot(p, SUN); const day = sm(-0.02, 0.2, s); const edge = sm(0, 0.3, d);
    const isLand = land(lat, lon);
    const rr = (isLand ? 0.9 + 0.35 * day : 0.6) * (0.55 + 0.45 * d);
    let c;
    if (isLand) {
      const tw = Math.max(0, 1 - Math.abs(s) / 0.09);       // 晨昏线附近的一道暖色
      const r = 78 + (244 - 78) * day + tw * 120, gg = 90 + (222 - 90) * day + tw * 30, b = 118 + (186 - 118) * day - tw * 80;
      c = `rgba(${Math.min(255, r) | 0},${gg | 0},${Math.max(0, b) | 0},${(0.5 + 0.5 * day + tw * 0.3) * edge})`;
    } else {
      c = `rgba(150,160,180,${(0.07 + 0.08 * day) * edge})`;
    }
    g.fillStyle = c; g.beginPath(); g.arc(x, y, rr, 0, 7); g.fill();
  }
}

// 电台：夜里是城市灯火，白天是印上去的小墨点
g.globalCompositeOperation = 'lighter';
for (const [lat, lon, n] of geo.clusters) {
  const p = xyz(lat, lon); const [x, y, d] = scr(p);
  if (d <= 0.05) continue;
  const s = dot(p, SUN); if (s > 0.02) continue;
  const k = (1 - sm(-0.05, 0.02, s)) * sm(0.05, 0.35, d);
  const r = 1 + Math.log2(n + 1) * 0.55;
  const halo = g.createRadialGradient(x, y, 0, x, y, r * 3);
  halo.addColorStop(0, `rgba(255,186,104,${0.3 * k})`); halo.addColorStop(0.3, `rgba(255,150,70,${0.08 * k})`); halo.addColorStop(1, 'rgba(255,140,60,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(x, y, r * 3, 0, 7); g.fill();
  g.fillStyle = `rgba(255,226,180,${0.85 * k})`; g.beginPath(); g.arc(x, y, Math.min(1.7, 0.7 + r * 0.25), 0, 7); g.fill();
}
g.globalCompositeOperation = 'source-over';
for (const [lat, lon, n] of geo.clusters) {
  const p = xyz(lat, lon); const [x, y, d] = scr(p);
  if (d <= 0.05 || dot(p, SUN) <= 0.02) continue;
  g.fillStyle = `rgba(28,24,22,${0.75 * sm(0.05, 0.3, d)})`;
  g.beginPath(); g.arc(x, y, 0.9 + Math.log2(n + 1) * 0.32, 0, 7); g.fill();
}

// ---------- 调谐经线（朱砂） ----------
g.beginPath(); let pen = false;
for (let lat = -90; lat <= 90; lat += 0.5) {
  const [x, y, d] = scr(xyz(lat, TUNE_LON));
  if (d > 0) { pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; } else pen = false;
}
g.strokeStyle = 'rgba(226,68,43,.85)'; g.lineWidth = 1.2; g.shadowColor = 'rgba(226,68,43,.6)'; g.shadowBlur = 8; g.stroke(); g.shadowBlur = 0;

// 环的正面
drawRing(true);

// 日落点（晨昏线与赤道环的交点）
{
  const [x, y] = scr(ringPt(101, RING)); const [lx, ly] = scr(ringPt(101, RING + 0.2));
  g.fillStyle = '#c8a26a'; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill();
  g.font = '400 12px "Noto Serif SC", SimSun, serif'; g.fillText('日落', lx, ly);
}
// 指针：经线和环的交点
{
  const [x, y] = scr(ringPt(TUNE_LON, RING));
  g.fillStyle = '#e2442b'; g.beginPath(); g.moveTo(x, y - 7); g.lineTo(x + 5, y + 2); g.lineTo(x - 5, y + 2); g.closePath(); g.fill();
}

// ---------- 右侧刻度：电台按纬度排在经线上 ----------
const STATIONS = [
  ['锡林郭勒 · 草原之声', 'N 43.9° · 19:04', 43.9, 116.1],
  ['北京音乐广播 97.4', 'N 39.9° · 19:00 · 正在播放', 39.9, 116.4, true],
  ['安徽音乐广播', 'N 31.8° · 19:04', 31.8, 117.2],
  ['赣州交通广播', 'N 25.8° · 18:55', 25.8, 114.9],
  ['斯里巴加湾 Pelangi FM', 'N 4.9° · 18:55', 4.9, 114.9],
  ['珀斯 96FM', 'S 31.9° · 18:59', -31.9, 115.9],
];
const scale = document.getElementById('scale');
const LX = 1118; let lastY = -1e9;
g.lineWidth = 1;
for (const [name, sub, lat, lon, on] of STATIONS) {
  const [px, py] = scr(xyz(lat, TUNE_LON));
  const ly = Math.max(py, lastY + 46); lastY = ly;
  // 引线：从经线上的点水平出发，靠近列表时折一下
  g.strokeStyle = on ? 'rgba(226,68,43,.8)' : 'rgba(238,230,212,.12)';
  g.beginPath(); g.moveTo(px + 6, py); g.lineTo(LX - 40, py); g.lineTo(LX - 14, ly); g.lineTo(LX - 6, ly); g.stroke();
  g.fillStyle = on ? '#e2442b' : 'rgba(238,230,212,.85)';
  g.beginPath(); g.arc(px, py, on ? 4 : 2.4, 0, 7); g.fill();
  if (on) { g.strokeStyle = 'rgba(226,68,43,.5)'; g.beginPath(); g.arc(px, py, 10, 0, 7); g.stroke(); }
  const el = document.createElement('div'); el.className = 'st' + (on ? ' on' : '');
  el.style.top = ly + 'px'; el.innerHTML = `<b>${name}</b><small>${sub}</small>`;
  scale.append(el);
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
